[project]
name = "migrateiq"
version = "0.1.0"
description = "Migrate legacy SSIS, Informatica and T-SQL ETL to PySpark on AWS via a deterministic IR."
requires-python = ">=3.11"
dependencies = [
    "lxml>=6.1.3",
    "pydantic>=2.14.0",
    "sqlglot>=30.22.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: real LLM / AWS calls; costs money; run only when asked"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["sample_artifacts", "src/migrateiq/ir/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
exclude = ["tests/test_ir_models.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint.per-file-ignores]
# Pre-existing contract test; its layout predates the project conventions and is left as written.
"tests/test_ir_models.py" = ["I001"]

[project.scripts]
migrateiq = "migrateiq.cli:app"
